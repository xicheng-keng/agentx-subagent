## -*- c -*-
######################################################################
## mib2c.dbtable.conf -- LMDB-backed conceptual table handler generator.
##
## Custom mib2c template for the agentx-subagent project, the table-shaped
## counterpart of mib2c.dbscalar.conf. See docs/design.md chapter 3.2
## ("テーブル型オブジェクトの対応").
##
## Modeled on the stock mib2c.iterate.conf, but there is no in-memory row
## list: rows are discovered from the LMDB key space on demand
## (include/table_rows.h) and every cell is read/written through
## storage_lmdb.h. As in the scalar template there is intentionally no C
## variable holding MIB state.
##
## Storage key per cell = "<columnName>.<instance>", the column's MIB name
## plus the row's index sub-identifiers in dotted decimal, verbatim from the
## OID (e.g. "portDescr.3"). The instance is never interpreted here, so the
## same code serves integer, string and multi-object indexes; the typed
## conversion in both directions is net-snmp's own, behind
## include/table_oid.h, where the MIB's index types are known.
##
## Storage backend is selected PER COLUMN, not per table:
##
##   read-write column : both the config.lmdb and the cache.lmdb path are
##                       emitted and STORAGE_MODE_<column> from
##                       storage_mode.h picks one at compile time. A missing
##                       definition would silently evaluate the #if as 0,
##                       i.e. silently mean cache_env, so every settable
##                       column gets an explicit #ifndef/#error guard.
##   read-only column  : cache_env unconditionally, no switch.
##
## A row therefore may straddle both environments; row enumeration takes the
## union of the instances found under each column in its own environment.
##
## RANGE and SIZE constraints are treated as ALTERNATIVES, per SMIv2: a value
## is accepted when it satisfies any one of them. Emitting one reject per
## range instead would make a MIB with disjoint alternatives -- Integer32
## (1..10 | 20..30), or SIZE (0 | 4 | 16) -- reject every value.
##
## Not generated (deliberately, see docs/design.md 3.2):
##   - row creation/destruction. These tables have no RowStatus column, so a
##     manager cannot conjure rows; rows come from the provisioned bootstrap
##     (config) or from the Rust telemetry writer (cache).
##   - external (AUGMENTS / foreign-table) indexes: the generated code needs
##     every index's syntax to parse an instance, so a table whose indexes
##     are not all resolvable here is rejected with an #error rather than
##     generating code that would mis-parse instances.
######################################################################
@open ${name}.h@
/*
 * $name.h -- LMDB-backed net-snmp table handlers for the $name group.
 *
 * GENERATED by mib2c using mib2c/mib2c.dbtable.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 */
#ifndef $name.uc_H
#define $name.uc_H

#ifdef __cplusplus
extern "C" {
#endif

/* Registers every $name table with the master agent. Called from main.c. */
void init_$name(void);

#ifdef __cplusplus
}
#endif

#endif /* $name.uc_H */
######################################################################
@open ${name}.c@
/*
 * $name.c -- LMDB-backed net-snmp table handlers for the $name group.
 *
 * GENERATED by mib2c using mib2c/mib2c.dbtable.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 *
 * Rows are not held in memory: each request enumerates them from the LMDB
 * key space (table_rows.h) and every cell is read on MODE_GET / written on
 * MODE_SET_ACTION through storage_lmdb.h (config_env / cache_env, see
 * subagent_env.h). The backend is chosen per column by storage_mode.h, so a
 * single row can straddle both environments.
 */
#include <net-snmp/net-snmp-config.h>
#include <net-snmp/net-snmp-includes.h>
#include <net-snmp/agent/net-snmp-agent-includes.h>
#include <stdlib.h>
#include <string.h>

#include "$name.h"
#include "storage_lmdb.h"
#include "storage_mode.h"
#include "subagent_env.h"
#include "table_oid.h"
#include "table_rows.h"

@foreach $i tables@
@eval $ncols = 0@
@eval $firstcol = "-"@
@eval $lastcol = "-"@
@foreach $c column@
@if $c.accessible@
@eval $ncols = $ncols + 1@
@if "$firstcol" eq "-"@
@eval $firstcol = "$c"@
@end@
@eval $lastcol = "$c"@
@end@
@end@
/* =================================================================== */
/* $i ($ncols accessible column(s))                                    */
/* =================================================================== */

@foreach $idx externalindex@
#error "table $i uses the external index $idx: mib2c.dbtable.conf cannot generate an instance parser for indexes it does not see (see the template header)"
@end@
@foreach $c column@
@if $c.accessible@
#define COLUMN_$c.uc $c.subid
@end@
@end@

@foreach $c column@
@if $c.accessible@
@if $c.settable@
#ifndef STORAGE_MODE_$c
#error "STORAGE_MODE_$c is not defined in storage_mode.h -- add an entry for the column '$c' (see docs/design.md 3.1/3.2)"
#endif
#if STORAGE_MODE_$c == STORAGE_MODE_PERSISTENT
#define TABLE_ENV_$c config_env
#else
#define TABLE_ENV_$c cache_env
#endif
@end@
@if !$c.settable@
/* $c is read-only: always cache.lmdb, no compile time switch. */
#define TABLE_ENV_$c cache_env
@end@
@end@
@end@

/* Number of accessible columns, i.e. of key prefixes a row can appear under. */
#define ${i}_NCOLUMNS $ncols

@foreach $c column@
@if $c.settable@
@eval $sawsize = 0@
@eval $maxsize = 0@
@if $c.perltype eq "OCTETSTR"@
@foreach $s, $e range $c@
@eval $sawsize = 1@
@eval $maxsize = ($e > $maxsize) ? $e : $maxsize@
@end@
@end@
## $sawsize, not $maxsize: SIZE (0) is a real constraint -- the value can
## only be empty -- and must size the buffer at 1, not fall back to the
## default meant for a MIB that gives no SIZE clause at all.
@eval $buflen = ($sawsize > 0) ? $maxsize + 1 : 256@
/*
 * MODE_SET_RESERVE2 stash for $c: the cell's previous state, so
 * MODE_SET_UNDO can restore it -- including the case where the cell did not
 * exist yet, which has to be undone by deleting it again rather than by
 * writing a zero.
 */
struct undo_$c {
    char   key[STORAGE_KEY_MAX + 1];
    int    existed;
@if $c.perltype eq "OCTETSTR"@
    size_t len;
    unsigned char data[$buflen];
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
    int32_t value;
@else@
    uint32_t value;
@end@
};

@end@
@end@
/* Loop state for one walk over $i's rows. */
struct ${i}_loop {
    table_rowset_t *rows;
    size_t          next;
};

/*
 * Data context for a matched row of $i.
 *
 * It carries no row data on purpose. net-snmp's table iterator hands the
 * same data context pointer to every request that matched the same row and
 * then releases it once per request, so a per-row allocation here would be a
 * double free the moment a manager set two columns of one row in a single
 * PDU. The address of this object only means "the row exists"; the instance
 * itself is recovered from the request's index varbinds with
 * table_instance_from_indexes() (see include/table_oid.h), which is also
 * what keeps MODE_SET_RESERVE2 and later working -- only MODE_SET_RESERVE1
 * walks the rows.
 */
static char ${i}_row_present;

/* Last reported count of skipped (malformed) cell keys, see below. */
static size_t ${i}_last_skipped;

static Netsnmp_Node_Handler        handle_$i;
static Netsnmp_First_Data_Point    ${i}_get_first_data_point;
static Netsnmp_Next_Data_Point     ${i}_get_next_data_point;
static Netsnmp_Free_Loop_Context   ${i}_free_loop_context;

/*
 * The (environment, column) pairs a row of $i can appear under. Filled at
 * call time rather than statically initialised because config_env/cache_env
 * are runtime handles.
 */
static void
${i}_column_refs(table_column_ref_t refs[${i}_NCOLUMNS])
{
@eval $refidx = 0@
@foreach $c column@
@if $c.accessible@
    refs[$refidx].env = TABLE_ENV_$c;
    refs[$refidx].column = "$c";
@eval $refidx = $refidx + 1@
@end@
@end@
}

static netsnmp_variable_list *
${i}_get_first_data_point(void **loop_context, void **data_context,
                          netsnmp_variable_list *put_index_data,
                          netsnmp_iterator_info *iinfo)
{
    table_column_ref_t refs[${i}_NCOLUMNS];
    struct ${i}_loop *loop;
    table_rowset_t *rows = NULL;
    storage_rc_t rc;

    /*
     * With NETSNMP_ITERATOR_FLAG_SORTED the iterator passes a hint of its own
     * in *loop_context. This function ignores it and installs its own loop
     * state -- but it must install something on every path, including the
     * failure paths below: whatever *loop_context holds at the end of the
     * iteration is handed to ${i}_free_loop_context().
     */
    *loop_context = NULL;

    ${i}_column_refs(refs);

    rc = table_rowset_load(refs, ${i}_NCOLUMNS, &rows);
    if (rc != STORAGE_OK) {
        snmp_log(LOG_ERR, "$i: row enumeration failed: %s\n",
                  storage_strerror(rc));
        return NULL;
    }
    /*
     * Rows are enumerated once per request, so an unconditional warning here
     * would repeat for every varbind of every walk. Report only when the
     * count changes, which still surfaces a writer that starts (or stops)
     * producing malformed keys without burying the log.
     */
    if (table_rowset_skipped(rows) != ${i}_last_skipped) {
        ${i}_last_skipped = table_rowset_skipped(rows);
        if (${i}_last_skipped > 0) {
            snmp_log(LOG_WARNING,
                      "$i: ignoring %lu cell key(s) whose row instance is not "
                      "canonical dotted decimal\n",
                      (unsigned long)${i}_last_skipped);
        }
    }

    loop = calloc(1, sizeof(*loop));
    if (loop == NULL) {
        table_rowset_free(rows);
        snmp_log(LOG_ERR, "$i: out of memory allocating loop context\n");
        return NULL;
    }
    loop->rows = rows;
    loop->next = 0;
    *loop_context = loop;

    return ${i}_get_next_data_point(loop_context, data_context,
                                    put_index_data, iinfo);
}

static netsnmp_variable_list *
${i}_get_next_data_point(void **loop_context, void **data_context,
                         netsnmp_variable_list *put_index_data,
                         netsnmp_iterator_info *iinfo)
{
    struct ${i}_loop *loop = (struct ${i}_loop *)*loop_context;

    (void)iinfo;

    if (loop == NULL) {
        return NULL;
    }

    while (loop->next < table_rowset_count(loop->rows)) {
        const table_instance_t *inst = table_rowset_at(loop->rows, loop->next++);

        /*
         * put_index_data carries this table's index syntax, so filling it is
         * also the validation step: a key whose instance does not decode into
         * exactly these indexes is not a row of this table and is skipped
         * rather than reported as one.
         */
        if (table_instance_to_indexes(inst, put_index_data) != 0) {
            char rejected[STORAGE_KEY_MAX + 1];

            if (table_instance_format(inst, rejected, sizeof(rejected))
                    != STORAGE_OK) {
                rejected[0] = '\0';
            }
            snmp_log(LOG_WARNING,
                      "$i: instance '%s' does not match the table's index "
                      "syntax, skipping the row\n", rejected);
            continue;
        }

        *data_context = &${i}_row_present;

        return put_index_data;
    }

    return NULL;
}

static void
${i}_free_loop_context(void *context, netsnmp_iterator_info *iinfo)
{
    struct ${i}_loop *loop = (struct ${i}_loop *)context;

    (void)iinfo;

    if (loop == NULL) {
        return;
    }
    table_rowset_free(loop->rows);
    free(loop);
}

/** Registers the $i table with the master agent. */
static void
init_table_$i(void)
{
    static const oid ${i}_oid[] = { $i.commaoid };
    netsnmp_handler_registration *reg;
    netsnmp_table_registration_info *table_info;
    netsnmp_iterator_info *iinfo;

    DEBUGMSGTL(("$name", "Registering table $i\n"));

    reg = netsnmp_create_handler_registration(
              "$i", handle_$i, ${i}_oid, OID_LENGTH(${i}_oid),
@if $i.settable@
              HANDLER_CAN_RWRITE);
@end@
@if !$i.settable@
              HANDLER_CAN_RONLY);
@end@
    if (reg == NULL) {
        snmp_log(LOG_ERR, "$i: handler registration allocation failed\n");
        return;
    }

    table_info = SNMP_MALLOC_TYPEDEF(netsnmp_table_registration_info);
    iinfo = SNMP_MALLOC_TYPEDEF(netsnmp_iterator_info);
    if (table_info == NULL || iinfo == NULL) {
        snmp_log(LOG_ERR, "$i: out of memory registering the table\n");
        SNMP_FREE(table_info);
        SNMP_FREE(iinfo);
        netsnmp_handler_registration_free(reg);
        return;
    }

    netsnmp_table_helper_add_indexes(table_info,
@foreach $idx index@
                                      $idx.type, /* index: $idx */
@end@
                                      0);
    table_info->min_column = COLUMN_$firstcol.uc;
    table_info->max_column = COLUMN_$lastcol.uc;

    iinfo->get_first_data_point     = ${i}_get_first_data_point;
    iinfo->get_next_data_point      = ${i}_get_next_data_point;
    iinfo->free_loop_context_at_end = ${i}_free_loop_context;
    /* No free_data_context: a matched row's context is the static sentinel
     * above, not an allocation (see its comment). */
    iinfo->table_reginfo            = table_info;
    /* table_rowset_load() returns rows already in OID order, which lets the
     * iterator stop a GETNEXT at the first row past the requested one. */
    iinfo->flags                   |= NETSNMP_ITERATOR_FLAG_SORTED;

    if (netsnmp_register_table_iterator(reg, iinfo) != SNMPERR_SUCCESS) {
        snmp_log(LOG_ERR, "$i: netsnmp_register_table_iterator failed\n");
    }
}

/** Handles requests for the $i table. */
static int
handle_$i(netsnmp_mib_handler *handler,
          netsnmp_handler_registration *reginfo,
          netsnmp_agent_request_info *reqinfo,
          netsnmp_request_info *requests)
{
    netsnmp_request_info *request;

    (void)handler;
    (void)reginfo;

    switch (reqinfo->mode) {

    case MODE_GET:
        for (request = requests; request != NULL; request = request->next) {
            netsnmp_table_request_info *table_info =
                netsnmp_extract_table_info(request);
            table_instance_t row;
            const table_instance_t *inst = &row;
            char key[STORAGE_KEY_MAX + 1];

            if (table_info == NULL) {
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                continue;
            }
            if (netsnmp_extract_iterator_context(request) == NULL) {
                netsnmp_set_request_error(reqinfo, request, SNMP_NOSUCHINSTANCE);
                continue;
            }
            if (table_instance_from_indexes(table_info, &row) != 0) {
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                continue;
            }

            switch (table_info->colnum) {
@foreach $c column@
@if $c.readable@
@eval $sawsize = 0@
@eval $maxsize = 0@
@if $c.perltype eq "OCTETSTR"@
@foreach $s, $e range $c@
@eval $sawsize = 1@
@eval $maxsize = ($e > $maxsize) ? $e : $maxsize@
@end@
@end@
## $sawsize, not $maxsize: SIZE (0) is a real constraint -- the value can
## only be empty -- and must size the buffer at 1, not fall back to the
## default meant for a MIB that gives no SIZE clause at all.
@eval $buflen = ($sawsize > 0) ? $maxsize + 1 : 256@
            case COLUMN_$c.uc:
                {
@if $c.perltype eq "OCTETSTR"@
                    unsigned char buf[$buflen];
                    size_t len = sizeof(buf);
                    storage_rc_t rc;

                    if (table_cell_key("$c", inst, key, sizeof(key)) != STORAGE_OK) {
                        netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                        break;
                    }
                    rc = storage_get_bytes(TABLE_ENV_$c, key, buf, &len);
                    if (rc == STORAGE_ERR_NOTFOUND) {
                        /* A row can exist while one of its cells does not;
                         * report the hole rather than inventing a value. */
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_NOSUCHINSTANCE);
                        break;
                    }
                    if (rc != STORAGE_OK) {
                        snmp_log(LOG_ERR, "%s: storage_get_bytes failed: %s\n",
                                  key, storage_strerror(rc));
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_GENERR);
                        break;
                    }
                    snmp_set_var_typed_value(request->requestvb, ASN_OCTET_STR,
                                              buf, len);
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
                    int32_t val;
                    storage_rc_t rc;

                    if (table_cell_key("$c", inst, key, sizeof(key)) != STORAGE_OK) {
                        netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                        break;
                    }
                    rc = storage_get_int(TABLE_ENV_$c, key, &val);
                    if (rc == STORAGE_ERR_NOTFOUND) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_NOSUCHINSTANCE);
                        break;
                    }
                    if (rc != STORAGE_OK) {
                        snmp_log(LOG_ERR, "%s: storage_get_int failed: %s\n",
                                  key, storage_strerror(rc));
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_GENERR);
                        break;
                    }
                    snmp_set_var_typed_integer(request->requestvb, $c.type,
                                                (long)val);
@else@
                    uint32_t val;
                    storage_rc_t rc;

                    if (table_cell_key("$c", inst, key, sizeof(key)) != STORAGE_OK) {
                        netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                        break;
                    }
                    rc = storage_get_uint(TABLE_ENV_$c, key, &val);
                    if (rc == STORAGE_ERR_NOTFOUND) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_NOSUCHINSTANCE);
                        break;
                    }
                    if (rc != STORAGE_OK) {
                        snmp_log(LOG_ERR, "%s: storage_get_uint failed: %s\n",
                                  key, storage_strerror(rc));
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_GENERR);
                        break;
                    }
                    snmp_set_var_typed_integer(request->requestvb, $c.type,
                                                (long)val);
@end@
                }
                break;

@end@
@end@
            default:
                netsnmp_set_request_error(reqinfo, request, SNMP_NOSUCHOBJECT);
                break;
            }
        }
        break;

@if $i.settable@
    /*
     * SET REQUEST -- full net-snmp four phase state machine, per cell.
     * http://www.net-snmp.org/tutorial-5/toolkit/mib_module/set-actions.jpg
     */
    case MODE_SET_RESERVE1:
        for (request = requests; request != NULL; request = request->next) {
            netsnmp_table_request_info *table_info =
                netsnmp_extract_table_info(request);

            if (table_info == NULL) {
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                continue;
            }
            if (netsnmp_extract_iterator_context(request) == NULL) {
                /*
                 * No such row. This table has no RowStatus column, so a
                 * manager cannot bring one into existence (docs/design.md
                 * 3.2): rows are provisioned at bootstrap or written by the
                 * telemetry application.
                 */
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_NOCREATION);
                continue;
            }

            switch (table_info->colnum) {
@foreach $c column@
@if $c.settable@
@eval $sawsize = 0@
@eval $maxsize = 0@
@if $c.perltype eq "OCTETSTR"@
@foreach $s, $e range $c@
@eval $sawsize = 1@
@eval $maxsize = ($e > $maxsize) ? $e : $maxsize@
@end@
@end@
## $sawsize, not $maxsize: SIZE (0) is a real constraint -- the value can
## only be empty -- and must size the buffer at 1, not fall back to the
## default meant for a MIB that gives no SIZE clause at all.
@eval $buflen = ($sawsize > 0) ? $maxsize + 1 : 256@
            case COLUMN_$c.uc:
                {
@if $c.perltype eq "OCTETSTR"@
                    int ret = netsnmp_check_vb_type(request->requestvb,
                                                     ASN_OCTET_STR);
@if $c.ranges@
                    size_t vlen = request->requestvb->val_len;
                    int len_ok = 0;
@end@

                    if (ret != SNMP_ERR_NOERROR) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_WRONGTYPE);
                        break;
                    }
@if $c.ranges@
                    /*
                     * A SIZE clause lists alternatives, so a length is legal
                     * when it falls inside ANY of them. Rejecting per range
                     * instead would refuse a length another alternative
                     * allows -- SIZE (0 | 4 | 16) would accept nothing.
                     */
@foreach $s, $e range $c@
@eval $rangelow = $s@
@if $rangelow > 0@
                    if (vlen >= (size_t)($s) && vlen <= (size_t)($e)) {
@end@
@if $rangelow == 0@
                    /* No lower bound to test: val_len is unsigned, and
                     * comparing it against 0 is a -Wtype-limits warning. */
                    if (vlen <= (size_t)($e)) {
@end@
                        len_ok = 1;
                    }
@end@
                    if (!len_ok) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_WRONGLENGTH);
                        break;
                    }
@end@
@else@
                    int ret = netsnmp_check_vb_type(request->requestvb, $c.type);
                    long v;
@if $c.ranges@
                    int in_range = 0;
@end@

                    if (ret != SNMP_ERR_NOERROR) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_WRONGTYPE);
                        break;
                    }
                    v = *request->requestvb->val.integer;
@if $c.enums@
                    switch (v) {
@foreach $lbl, $val enum@
                    case $val:
@end@
                        break;
                    default:
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_WRONGVALUE);
                    }
@end@
@if $c.ranges@
                    /* Alternatives, as for SIZE above: in ANY range is legal. */
@foreach $s, $e range $c@
                    if (v >= ($s) && v <= ($e)) {
                        in_range = 1;
                    }
@end@
                    if (!in_range) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_WRONGVALUE);
                        break;
                    }
@end@
@end@
                }
                break;

@end@
@end@
            default:
                netsnmp_set_request_error(reqinfo, request,
                                           SNMP_ERR_NOTWRITABLE);
                break;
            }
        }
        break;

    case MODE_SET_RESERVE2:
        for (request = requests; request != NULL; request = request->next) {
            netsnmp_table_request_info *table_info =
                netsnmp_extract_table_info(request);
            table_instance_t row;
            const table_instance_t *inst = &row;

            if (table_info == NULL ||
                netsnmp_extract_iterator_context(request) == NULL ||
                table_instance_from_indexes(table_info, &row) != 0) {
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                continue;
            }

            switch (table_info->colnum) {
@foreach $c column@
@if $c.settable@
            case COLUMN_$c.uc:
                {
                    struct undo_$c *prev = calloc(1, sizeof(*prev));
                    storage_rc_t rc;

                    if (prev == NULL) {
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_RESOURCEUNAVAILABLE);
                        break;
                    }
                    if (table_cell_key("$c", inst, prev->key,
                                        sizeof(prev->key)) != STORAGE_OK) {
                        free(prev);
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_GENERR);
                        break;
                    }
@if $c.perltype eq "OCTETSTR"@
                    prev->len = sizeof(prev->data);
                    rc = storage_get_bytes(TABLE_ENV_$c, prev->key,
                                            prev->data, &prev->len);
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
                    rc = storage_get_int(TABLE_ENV_$c, prev->key, &prev->value);
@else@
                    rc = storage_get_uint(TABLE_ENV_$c, prev->key, &prev->value);
@end@
                    if (rc == STORAGE_ERR_NOTFOUND) {
                        prev->existed = 0;
@if $c.perltype eq "OCTETSTR"@
                        prev->len = 0;
@end@
                    } else if (rc != STORAGE_OK) {
                        free(prev);
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_RESOURCEUNAVAILABLE);
                        break;
                    } else {
                        prev->existed = 1;
                    }
                    netsnmp_request_add_list_data(request,
                        netsnmp_create_data_list("undo_$c", prev, free));
                }
                break;

@end@
@end@
            default:
                break;
            }
        }
        break;

    case MODE_SET_FREE:
        /* RESERVE1/RESERVE2 failed somewhere; release any stash taken. */
        for (request = requests; request != NULL; request = request->next) {
@foreach $c column@
@if $c.settable@
            netsnmp_request_remove_list_data(request, "undo_$c");
@end@
@end@
        }
        break;

    case MODE_SET_ACTION:
        for (request = requests; request != NULL; request = request->next) {
            netsnmp_table_request_info *table_info =
                netsnmp_extract_table_info(request);
            table_instance_t row;
            const table_instance_t *inst = &row;
            char key[STORAGE_KEY_MAX + 1];

            if (table_info == NULL ||
                netsnmp_extract_iterator_context(request) == NULL ||
                table_instance_from_indexes(table_info, &row) != 0) {
                netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                continue;
            }

            switch (table_info->colnum) {
@foreach $c column@
@if $c.settable@
            case COLUMN_$c.uc:
                {
                    storage_rc_t rc;

                    if (table_cell_key("$c", inst, key, sizeof(key)) != STORAGE_OK) {
                        netsnmp_set_request_error(reqinfo, request, SNMP_ERR_GENERR);
                        break;
                    }
@if $c.perltype eq "OCTETSTR"@
                    rc = storage_set_bytes(TABLE_ENV_$c, key,
                                            request->requestvb->val.string,
                                            request->requestvb->val_len);
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
                    rc = storage_set_int(TABLE_ENV_$c, key,
                                          (int32_t)*request->requestvb->val.integer);
@else@
                    rc = storage_set_uint(TABLE_ENV_$c, key,
                                           (uint32_t)*request->requestvb->val.integer);
@end@
                    if (rc != STORAGE_OK) {
                        snmp_log(LOG_ERR, "%s: storage write failed: %s\n",
                                  key, storage_strerror(rc));
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_COMMITFAILED);
                    }
                }
                break;

@end@
@end@
            default:
                break;
            }
        }
        break;

    case MODE_SET_COMMIT:
        /* Success: the stashed previous values are no longer needed. */
        for (request = requests; request != NULL; request = request->next) {
@foreach $c column@
@if $c.settable@
            netsnmp_request_remove_list_data(request, "undo_$c");
@end@
@end@
        }
        break;

    case MODE_SET_UNDO:
        for (request = requests; request != NULL; request = request->next) {
@foreach $c column@
@if $c.settable@
            {
                struct undo_$c *prev = (struct undo_$c *)
                    netsnmp_request_get_list_data(request, "undo_$c");

                if (prev != NULL) {
                    storage_rc_t rc;

                    if (prev->existed) {
@if $c.perltype eq "OCTETSTR"@
                        rc = storage_set_bytes(TABLE_ENV_$c, prev->key,
                                                prev->data, prev->len);
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
                        rc = storage_set_int(TABLE_ENV_$c, prev->key, prev->value);
@else@
                        rc = storage_set_uint(TABLE_ENV_$c, prev->key, prev->value);
@end@
                    } else {
                        /* The cell did not exist before this SET, so undoing
                         * means removing it again, not zeroing it. */
                        rc = storage_delete(TABLE_ENV_$c, prev->key);
                        if (rc == STORAGE_ERR_NOTFOUND) {
                            rc = STORAGE_OK;
                        }
                    }
                    if (rc != STORAGE_OK) {
                        snmp_log(LOG_ERR, "%s: UNDO failed: %s\n",
                                  prev->key, storage_strerror(rc));
                        netsnmp_set_request_error(reqinfo, request,
                                                   SNMP_ERR_UNDOFAILED);
                    }
                    netsnmp_request_remove_list_data(request, "undo_$c");
                }
            }
@end@
@end@
        }
        break;
@end@

    default:
        snmp_log(LOG_ERR, "unknown mode (%d) in handle_$i\n", reqinfo->mode);
        return SNMP_ERR_GENERR;
    }

    return SNMP_ERR_NOERROR;
}

@end@
/** Registers every $name table with the master agent. */
void
init_$name(void)
{
    DEBUGMSGTL(("$name", "Initializing\n"));

@foreach $i tables@
    init_table_$i();
@end@
}
