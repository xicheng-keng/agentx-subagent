## -*- c -*-
######################################################################
## mib2c.dbscalar.conf -- LMDB-backed scalar handler generator.
##
## Custom mib2c template for the agentx-subagent project.  See
## docs/design.md chapter 3.1 ("mib2cカスタマイズ方針 / 3.1 振り分け方式").
##
## Modeled on the stock mib2c.scalar.conf, but every MODE_GET reads the
## value from storage_lmdb.h and every MODE_SET writes it back there --
## there is intentionally no C variable holding MIB state.
##
## Storage key = the MIB object name exactly as it appears in the MIB
## (e.g. "sampleIntervalSec").
##
## For read-write ($i.settable) objects, both the config.lmdb and the
## cache.lmdb code paths are emitted, chosen at compile time by the
## STORAGE_MODE_$i macro from storage_mode.h (docs/design.md 3.1):
##
##   #if STORAGE_MODE_$i == STORAGE_MODE_PERSISTENT
##       ... config_env ...
##   #else
##       ... cache_env ...
##   #endif
##
## A missing STORAGE_MODE_$i definition would silently evaluate the
## #if as 0 (i.e. silently fall back to cache_env), so every settable
## handler is preceded by an explicit #ifndef / #error guard.
##
## For read-only objects, cache_env is used unconditionally, no switch.
##
## RANGE and SIZE constraints are treated as ALTERNATIVES, per SMIv2: a value
## is accepted when it satisfies any one of them. Emitting one reject per
## range instead would make a MIB with disjoint alternatives -- Integer32
## (1..10 | 20..30), or SIZE (0 | 4 | 16) -- reject every value.
######################################################################
@open ${name}.h@
/*
 * $name.h -- LMDB-backed net-snmp scalar handlers for the $name group.
 *
 * GENERATED by mib2c using mib2c/mib2c.dbscalar.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 */
#ifndef $name.uc_H
#define $name.uc_H

#ifdef __cplusplus
extern "C" {
#endif

/* Registers all $name scalars with the master agent. Called from main.c. */
void init_$name(void);

#ifdef __cplusplus
}
#endif

#endif /* $name.uc_H */
######################################################################
@open ${name}.c@
/*
 * $name.c -- LMDB-backed net-snmp scalar handlers for the $name group.
 *
 * GENERATED by mib2c using mib2c/mib2c.dbscalar.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 *
 * Every value read on MODE_GET and written on MODE_SET_ACTION goes
 * through storage_lmdb.h (config_env / cache_env, see subagent_env.h).
 * There is no C static/global variable holding MIB state.
 */
#include <net-snmp/net-snmp-config.h>
#include <net-snmp/net-snmp-includes.h>
#include <net-snmp/agent/net-snmp-agent-includes.h>
#include <stdlib.h>
#include <string.h>

#include "$name.h"
#include "storage_lmdb.h"
#include "storage_mode.h"
#include "subagent_env.h"
#include "demo_trap.h"

@foreach $i scalars@
static int handle_$i(netsnmp_mib_handler *handler,
                      netsnmp_handler_registration *reginfo,
                      netsnmp_agent_request_info *reqinfo,
                      netsnmp_request_info *requests);
@end@

/** Registers the $name scalars with the master agent. */
void
init_$name(void)
{
    DEBUGMSGTL(("$name", "Initializing\n"));

@foreach $i scalars@
    {
        static const oid ${i}_oid[] = { $i.commaoid };

        netsnmp_register_scalar(
            netsnmp_create_handler_registration(
                "$i", handle_$i, ${i}_oid, OID_LENGTH(${i}_oid),
@if $i.settable@
                HANDLER_CAN_RWRITE));
@end@
@if !$i.settable@
                HANDLER_CAN_RONLY));
@end@
    }
@end@
}

@foreach $i scalars@
/* ------------------------------------------------------------------ */
/* $i ($i.syntax, $i.access)                                          */
/* ------------------------------------------------------------------ */
@if $i.settable@
#ifndef STORAGE_MODE_$i
#error "STORAGE_MODE_$i is not defined in storage_mode.h -- add an entry for '$i' (see docs/design.md 3.1)"
#endif

@end@
@eval $sawsize = 0@
@eval $maxsize = 0@
@if $i.perltype eq "OCTETSTR"@
@foreach $s, $e range $i@
@eval $sawsize = 1@
@eval $maxsize = ($e > $maxsize) ? $e : $maxsize@
@end@
@end@
## $sawsize, not $maxsize: SIZE (0) is a real constraint -- the value can
## only be empty -- and must size the buffer at 1, not fall back to the
## default meant for a MIB that gives no SIZE clause at all.
@eval $buflen = ($sawsize > 0) ? $maxsize + 1 : 256@
static int
handle_$i(netsnmp_mib_handler *handler,
          netsnmp_handler_registration *reginfo,
          netsnmp_agent_request_info *reqinfo,
          netsnmp_request_info *requests)
{
    (void)handler;
    (void)reginfo;
@if $i.settable@
    storage_env_t *env;

#if STORAGE_MODE_$i == STORAGE_MODE_PERSISTENT
    env = config_env;
#else
    env = cache_env;
#endif
@end@
@if !$i.settable@
    storage_env_t *env = cache_env; /* read-only: always cache.lmdb */
@end@

    switch (reqinfo->mode) {

    case MODE_GET:
        {
@if $i.perltype eq "OCTETSTR"@
            unsigned char buf[$buflen];
            size_t len = sizeof(buf);
            storage_rc_t rc = storage_get_bytes(env, "$i", buf, &len);

            if (rc == STORAGE_ERR_NOTFOUND) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_NOSUCHINSTANCE);
                break;
            }
            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_get_bytes failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_GENERR);
                break;
            }
            snmp_set_var_typed_value(requests->requestvb, ASN_OCTET_STR, buf, len);
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
            int32_t val;
            storage_rc_t rc = storage_get_int(env, "$i", &val);

            if (rc == STORAGE_ERR_NOTFOUND) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_NOSUCHINSTANCE);
                break;
            }
            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_get_int failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_GENERR);
                break;
            }
            snmp_set_var_typed_integer(requests->requestvb, $i.type, (long)val);
@else@
            uint32_t val;
            storage_rc_t rc = storage_get_uint(env, "$i", &val);

            if (rc == STORAGE_ERR_NOTFOUND) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_NOSUCHINSTANCE);
                break;
            }
            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_get_uint failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_GENERR);
                break;
            }
            snmp_set_var_typed_integer(requests->requestvb, $i.type, (long)val);
@end@
        }
        break;

@if $i.settable@
    /*
     * SET REQUEST -- full net-snmp four phase state machine.
     * http://www.net-snmp.org/tutorial-5/toolkit/mib_module/set-actions.jpg
     */
    case MODE_SET_RESERVE1:
        {
@if $i.perltype eq "OCTETSTR"@
            int ret = netsnmp_check_vb_type(requests->requestvb, ASN_OCTET_STR);
@if $i.ranges@
            size_t vlen = requests->requestvb->val_len;
            int len_ok = 0;
@end@

            if (ret != SNMP_ERR_NOERROR) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_WRONGTYPE);
                break;
            }
@if $i.ranges@
            /*
             * A SIZE clause lists alternatives, so a length is legal when it
             * falls inside ANY of them. Rejecting per range instead would
             * refuse a length another alternative allows -- SIZE (0 | 4 | 16)
             * would accept nothing.
             */
@foreach $s, $e range $i@
@eval $rangelow = $s@
@if $rangelow > 0@
            if (vlen >= (size_t)($s) && vlen <= (size_t)($e)) {
@end@
@if $rangelow == 0@
            /* No lower bound to test: val_len is unsigned, and comparing it
             * against 0 is a -Wtype-limits warning. */
            if (vlen <= (size_t)($e)) {
@end@
                len_ok = 1;
            }
@end@
            if (!len_ok) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_WRONGLENGTH);
                break;
            }
@end@
@else@
            int ret = netsnmp_check_vb_type(requests->requestvb, $i.type);
            long v;
@if $i.ranges@
            int in_range = 0;
@end@

            if (ret != SNMP_ERR_NOERROR) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_WRONGTYPE);
                break;
            }
            v = *requests->requestvb->val.integer;
@if $i.enums@
            switch (v) {
@foreach $lbl, $val enum@
            case $val:
@end@
                break;
            default:
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_WRONGVALUE);
            }
@end@
@if $i.ranges@
            /* Alternatives, as for SIZE above: in ANY range is legal. */
@foreach $s, $e range $i@
            if (v >= ($s) && v <= ($e)) {
                in_range = 1;
            }
@end@
            if (!in_range) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_WRONGVALUE);
                break;
            }
@end@
@end@
        }
        break;

    case MODE_SET_RESERVE2:
        {
@if $i.perltype eq "OCTETSTR"@
            struct undo_$i { size_t len; unsigned char data[$buflen]; };
            struct undo_$i *prev = malloc(sizeof(*prev));

            if (!prev) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                break;
            }
            prev->len = sizeof(prev->data);
            {
                storage_rc_t rc = storage_get_bytes(env, "$i", prev->data, &prev->len);

                if (rc == STORAGE_ERR_NOTFOUND) {
                    prev->len = 0;
                } else if (rc != STORAGE_OK) {
                    free(prev);
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                    break;
                }
            }
            netsnmp_request_add_list_data(requests,
                netsnmp_create_data_list("undo_$i", prev, free));
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
            int32_t *prev = malloc(sizeof(*prev));

            if (!prev) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                break;
            }
            {
                storage_rc_t rc = storage_get_int(env, "$i", prev);

                if (rc == STORAGE_ERR_NOTFOUND) {
                    *prev = 0;
                } else if (rc != STORAGE_OK) {
                    free(prev);
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                    break;
                }
            }
            netsnmp_request_add_list_data(requests,
                netsnmp_create_data_list("undo_$i", prev, free));
@else@
            uint32_t *prev = malloc(sizeof(*prev));

            if (!prev) {
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                break;
            }
            {
                storage_rc_t rc = storage_get_uint(env, "$i", prev);

                if (rc == STORAGE_ERR_NOTFOUND) {
                    *prev = 0;
                } else if (rc != STORAGE_OK) {
                    free(prev);
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_RESOURCEUNAVAILABLE);
                    break;
                }
            }
            netsnmp_request_add_list_data(requests,
                netsnmp_create_data_list("undo_$i", prev, free));
@end@
        }
        break;

    case MODE_SET_FREE:
        /* RESERVE1/RESERVE2 failed somewhere; release any stash taken. */
        netsnmp_request_remove_list_data(requests, "undo_$i");
        break;

    case MODE_SET_ACTION:
        {
@if $i.perltype eq "OCTETSTR"@
            storage_rc_t rc = storage_set_bytes(env, "$i",
                                                 requests->requestvb->val.string,
                                                 requests->requestvb->val_len);

            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_set_bytes failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_COMMITFAILED);
            }
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
            int32_t newval = (int32_t)*requests->requestvb->val.integer;
            storage_rc_t rc = storage_set_int(env, "$i", newval);

            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_set_int failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_COMMITFAILED);
                break;
            }
@if "$i" eq "tempThresholdMilliC"@
            /*
             * A threshold change can flip the alarm edge even if
             * cpuTempMilliC itself did not just change.
             */
            demo_check_temp_alarm();
@end@
@else@
            uint32_t newval = (uint32_t)*requests->requestvb->val.integer;
            storage_rc_t rc = storage_set_uint(env, "$i", newval);

            if (rc != STORAGE_OK) {
                snmp_log(LOG_ERR, "$i: storage_set_uint failed: %s\n",
                          storage_strerror(rc));
                netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_COMMITFAILED);
            }
@end@
        }
        break;

    case MODE_SET_COMMIT:
        /* Success: the stashed previous value is no longer needed. */
        netsnmp_request_remove_list_data(requests, "undo_$i");
        break;

    case MODE_SET_UNDO:
        {
@if $i.perltype eq "OCTETSTR"@
            struct undo_$i { size_t len; unsigned char data[$buflen]; };
            struct undo_$i *prev = netsnmp_request_get_list_data(requests, "undo_$i");

            if (prev) {
                storage_rc_t rc = storage_set_bytes(env, "$i", prev->data, prev->len);

                if (rc != STORAGE_OK) {
                    snmp_log(LOG_ERR, "$i: UNDO storage_set_bytes failed: %s\n",
                              storage_strerror(rc));
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_UNDOFAILED);
                }
            }
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
            int32_t *prev = netsnmp_request_get_list_data(requests, "undo_$i");

            if (prev) {
                storage_rc_t rc = storage_set_int(env, "$i", *prev);

                if (rc != STORAGE_OK) {
                    snmp_log(LOG_ERR, "$i: UNDO storage_set_int failed: %s\n",
                              storage_strerror(rc));
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_UNDOFAILED);
                }
            }
@else@
            uint32_t *prev = netsnmp_request_get_list_data(requests, "undo_$i");

            if (prev) {
                storage_rc_t rc = storage_set_uint(env, "$i", *prev);

                if (rc != STORAGE_OK) {
                    snmp_log(LOG_ERR, "$i: UNDO storage_set_uint failed: %s\n",
                              storage_strerror(rc));
                    netsnmp_set_request_error(reqinfo, requests, SNMP_ERR_UNDOFAILED);
                }
            }
@end@
            netsnmp_request_remove_list_data(requests, "undo_$i");
        }
        break;
@end@

    default:
        snmp_log(LOG_ERR, "unknown mode (%d) in handle_$i\n", reqinfo->mode);
        return SNMP_ERR_GENERR;
    }

    return SNMP_ERR_NOERROR;
}

@end@
