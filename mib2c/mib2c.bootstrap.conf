## -*- c -*-
######################################################################
## mib2c.bootstrap.conf -- LMDB DEFVAL bootstrap generator.
##
## Custom mib2c template for the agentx-subagent project.  See
## docs/design.md chapter 2.3 ("起動時初期化"), 3.1 and 3.2.
##
## Must be run over the WHOLE MIB module (or at least a subtree
## containing both demoConfig and demoStatus) so that it sees every
## scalar and every table, not just one access group.
##
## Emits BOTH functions declared in include/storage_bootstrap.h into a
## single generated file, src/generated/storage_bootstrap.c:
##
##   cache_bootstrap_defaults() seeds cache.lmdb, in a single write
##   transaction, with:
##     - every read-only scalar's DEFVAL (tmpfs is empty on every boot)
##     - every read-write scalar's DEFVAL, but only when its
##       STORAGE_MODE_<name> resolves to STORAGE_MODE_VOLATILE
##
##   config_bootstrap_defaults() seeds config.lmdb, in a single write
##   transaction, with:
##     - every read-write scalar's DEFVAL, but only when its
##       STORAGE_MODE_<name> resolves to STORAGE_MODE_PERSISTENT
##       (the mirror image of the cache selection above)
##     - a key already present is never overwritten (no overwrite
##       parameter -- see include/storage_bootstrap.h for why)
##
## Conceptual tables are seeded the same way, one level down: for every
## read-write column of a table, the DEFVAL is written into each of the rows
## the table is provisioned with (TABLE_ROWS_<table> in
## include/table_provision.h), under the cell key "<column>.<row>". Read-only
## table columns are NOT seeded: their rows belong to the Rust telemetry
## writer, and seeding them would fabricate rows for hardware that may not
## exist (docs/design.md 3.2). Because a table's row instances have to be
## enumerable here, only a single integer index is supported; anything else
## is a hard #error rather than silently wrong keys.
##
## In every case, a missing STORAGE_MODE_<name>, or a missing
## TABLE_ROWS_<table>, is a hard #error, never a silent 0. Objects without a
## DEFVAL clause in the MIB (e.g. sampleCount) get a documented zero/empty
## default instead.
######################################################################
@open storage_bootstrap.c@
/*
 * storage_bootstrap.c -- startup defaults for both LMDB environments.
 *
 * GENERATED by mib2c using mib2c/mib2c.bootstrap.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 *
 * Source of truth for each default is the MIB's DEFVAL clause
 * (mibs/AGENTX-DEMO-MIB.txt); objects without one get a documented
 * zero/empty value (see per-object comments below). Everything is
 * written in a single write transaction per function, per
 * include/storage_bootstrap.h.
 */
#include <string.h>

#include "storage_bootstrap.h"
#include "storage_lmdb.h"
#include "storage_mode.h"
#include "table_provision.h"
#include "table_rows.h"

storage_rc_t
cache_bootstrap_defaults(storage_env_t *cache, int overwrite)
{
    storage_txn_t *txn;
    storage_rc_t rc = storage_txn_begin(cache, 0 /* read-write */, &txn);

    if (rc != STORAGE_OK) {
        return rc;
    }

@foreach $i scalars@
@if $i.settable@
#ifndef STORAGE_MODE_$i
#error "STORAGE_MODE_$i is not defined in storage_mode.h -- add an entry for '$i' (see docs/design.md 3.1)"
#endif
#if STORAGE_MODE_$i == STORAGE_MODE_VOLATILE
    /* $i: read-write, but STORAGE_MODE_$i is VOLATILE -> lives in cache.lmdb */
    {
@end@
@if !$i.settable@
    /* $i: read-only, always cache.lmdb */
    {
@end@
@if $i.perltype eq "OCTETSTR"@
@if $i.hasdefval@
@eval $strval = "$i.defval"@
        static const char defval[] = $strval;
@else@
        /* no DEFVAL in the MIB: documented empty-string default */
        static const char defval[] = "";
@end@
        char probe[1];
        size_t probe_len = sizeof(probe);
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

        if (!overwrite) {
            exists_rc = storage_txn_get_bytes(txn, "$i", probe, &probe_len);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_bytes(txn, "$i", defval, strlen(defval));
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
        int32_t defval;
        int32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $i.enums@
        defval = 0; /* overwritten below if the DEFVAL label is matched */
@foreach $lbl, $val enum@
@if "$lbl" eq "$i.defval"@
        defval = $val; /* DEFVAL { $lbl } */
@end@
@end@
@elsif $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        if (!overwrite) {
            exists_rc = storage_txn_get_int(txn, "$i", &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_int(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@else@
        uint32_t defval;
        uint32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        if (!overwrite) {
            exists_rc = storage_txn_get_uint(txn, "$i", &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_uint(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@end@
    }
@if $i.settable@
#endif /* STORAGE_MODE_$i == STORAGE_MODE_VOLATILE */
@end@

@end@
@foreach $i tables@
@if $i.settable@
@eval $nidx = 0@
@foreach $idx index@
@eval $nidx = $nidx + 1@
@if $idx.needlength@
#error "table $i is indexed by $idx, whose syntax is not a single integer -- mib2c.bootstrap.conf can only provision rows for a single integer index (see include/table_provision.h)"
@end@
@end@
@if $nidx != 1@
#error "table $i has $nidx index objects -- mib2c.bootstrap.conf can only provision rows for a single integer index (see include/table_provision.h)"
@end@
#ifndef TABLE_ROWS_$i
#error "TABLE_ROWS_$i is not defined in table_provision.h -- declare how many rows '$i' ships with (see docs/design.md 3.2)"
#endif
@foreach $c column@
@if $c.settable@
#ifndef STORAGE_MODE_$c
#error "STORAGE_MODE_$c is not defined in storage_mode.h -- add an entry for the column '$c' (see docs/design.md 3.1/3.2)"
#endif
#if STORAGE_MODE_$c == STORAGE_MODE_VOLATILE
    /* $i.$c: read-write, but STORAGE_MODE_$c is VOLATILE -> lives in cache.lmdb */
    for (uint32_t row = 1; row <= (uint32_t)TABLE_ROWS_$i; row++) {
        table_instance_t inst = { { row }, 1 };
        char key[STORAGE_KEY_MAX + 1];
@if $c.perltype eq "OCTETSTR"@
@if $c.hasdefval@
@eval $strval = "$c.defval"@
        static const char defval[] = $strval;
@else@
        /* no DEFVAL in the MIB: documented empty-string default */
        static const char defval[] = "";
@end@
        char probe[1];
        size_t probe_len = sizeof(probe);
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        if (!overwrite) {
            exists_rc = storage_txn_get_bytes(txn, key, probe, &probe_len);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_bytes(txn, key, defval, strlen(defval));
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
        int32_t defval;
        int32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $c.enums@
        defval = 0; /* overwritten below if the DEFVAL label is matched */
@foreach $lbl, $val enum@
@if "$lbl" eq "$c.defval"@
        defval = $val; /* DEFVAL { $lbl } */
@end@
@end@
@elsif $c.hasdefval@
        defval = $c.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        if (!overwrite) {
            exists_rc = storage_txn_get_int(txn, key, &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_int(txn, key, defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@else@
        uint32_t defval;
        uint32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $c.hasdefval@
        defval = $c.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        if (!overwrite) {
            exists_rc = storage_txn_get_uint(txn, key, &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_uint(txn, key, defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@end@
    }
#endif /* STORAGE_MODE_$c == STORAGE_MODE_VOLATILE */

@end@
@end@
@end@
@end@
    return storage_txn_commit(txn);
}

