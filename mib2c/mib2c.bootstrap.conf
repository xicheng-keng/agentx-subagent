{
    storage_txn_t *txn;
    storage_rc_t rc = storage_txn_begin(config, 0 /* read-write */, &txn);

    if (rc != STORAGE_OK) {
        return rc;
    }

@foreach $i scalars@
@if $i.settable@
#ifndef STORAGE_MODE_$i
#error "STORAGE_MODE_$i is not defined in storage_mode.h -- add an entry for '$i' (see docs/design.md 3.1)"
#endif
#if STORAGE_MODE_$i == STORAGE_MODE_PERSISTENT
    /* $i: read-write, STORAGE_MODE_$i is PERSISTENT -> lives in config.lmdb */
    {
@if $i.perltype eq "OCTETSTR"@
@if $i.hasdefval@
@eval $strval = "$i.defval"@
        static const char defval[] = $strval;
@else@
        /* no DEFVAL in the MIB: documented empty-string default */
        static const char defval[] = "";
@end@
        char probe[1];
        size_t probe_len = sizeof(probe);
        storage_rc_t exists_rc = storage_txn_get_bytes(txn, "$i", probe, &probe_len);

        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_bytes(txn, "$i", defval, strlen(defval));
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
        int32_t defval;
        int32_t probe;
        storage_rc_t exists_rc;

@if $i.enums@
        defval = 0; /* overwritten below if the DEFVAL label is matched */
@foreach $lbl, $val enum@
@if "$lbl" eq "$i.defval"@
        defval = $val; /* DEFVAL { $lbl } */
@end@
@end@
@elsif $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        exists_rc = storage_txn_get_int(txn, "$i", &probe);
        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_int(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@else@
        uint32_t defval;
        uint32_t probe;
        storage_rc_t exists_rc;

@if $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        exists_rc = storage_txn_get_uint(txn, "$i", &probe);
        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_uint(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@end@
    }
#endif /* STORAGE_MODE_$i == STORAGE_MODE_PERSISTENT */
@end@

@end@
@foreach $i tables@
@if $i.settable@
@eval $nidx = 0@
@foreach $idx index@
@eval $nidx = $nidx + 1@
@if $idx.needlength@
#error "table $i is indexed by $idx, whose syntax is not a single integer -- mib2c.bootstrap.conf can only provision rows for a single integer index (see include/table_provision.h)"
@end@
@end@
@if $nidx != 1@
#error "table $i has $nidx index objects -- mib2c.bootstrap.conf can only provision rows for a single integer index (see include/table_provision.h)"
@end@
#ifndef TABLE_ROWS_$i
#error "TABLE_ROWS_$i is not defined in table_provision.h -- declare how many rows '$i' ships with (see docs/design.md 3.2)"
#endif
@foreach $c column@
@if $c.settable@
#ifndef STORAGE_MODE_$c
#error "STORAGE_MODE_$c is not defined in storage_mode.h -- add an entry for the column '$c' (see docs/design.md 3.1/3.2)"
#endif
#if STORAGE_MODE_$c == STORAGE_MODE_PERSISTENT
    /* $i.$c: read-write, STORAGE_MODE_$c is PERSISTENT -> lives in config.lmdb */
    for (uint32_t row = 1; row <= (uint32_t)TABLE_ROWS_$i; row++) {
        table_instance_t inst = { { row }, 1 };
        char key[STORAGE_KEY_MAX + 1];
@if $c.perltype eq "OCTETSTR"@
@if $c.hasdefval@
@eval $strval = "$c.defval"@
        static const char defval[] = $strval;
@else@
        /* no DEFVAL in the MIB: documented empty-string default */
        static const char defval[] = "";
@end@
        char probe[1];
        size_t probe_len = sizeof(probe);
        storage_rc_t exists_rc;

        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        exists_rc = storage_txn_get_bytes(txn, key, probe, &probe_len);
        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_bytes(txn, key, defval, strlen(defval));
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@elsif $c.perltype eq "INTEGER" || $c.perltype eq "INTEGER32"@
        int32_t defval;
        int32_t probe;
        storage_rc_t exists_rc;

@if $c.enums@
        defval = 0; /* overwritten below if the DEFVAL label is matched */
@foreach $lbl, $val enum@
@if "$lbl" eq "$c.defval"@
        defval = $val; /* DEFVAL { $lbl } */
@end@
@end@
@elsif $c.hasdefval@
        defval = $c.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        exists_rc = storage_txn_get_int(txn, key, &probe);
        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_int(txn, key, defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@else@
        uint32_t defval;
        uint32_t probe;
        storage_rc_t exists_rc;

@if $c.hasdefval@
        defval = $c.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        rc = table_cell_key("$c", &inst, key, sizeof(key));
        if (rc != STORAGE_OK) {
            storage_txn_abort(txn);
            return rc;
        }
        exists_rc = storage_txn_get_uint(txn, key, &probe);
        if (exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_uint(txn, key, defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@end@
    }
#endif /* STORAGE_MODE_$c == STORAGE_MODE_PERSISTENT */

@end@
@end@
@end@
@end@
    return storage_txn_commit(txn);
}
