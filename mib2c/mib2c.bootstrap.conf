## -*- c -*-
######################################################################
## mib2c.bootstrap.conf -- cache.lmdb DEFVAL bootstrap generator.
##
## Custom mib2c template for the agentx-subagent project.  See
## docs/design.md chapter 2.3 ("起動時初期化") and chapter 3.1.
##
## Must be run over the WHOLE MIB module (or at least a subtree
## containing both demoConfig and demoStatus) so that it sees every
## scalar, not just one access group.
##
## Emits cache_bootstrap_defaults() (include/cache_bootstrap.h), which
## seeds cache.lmdb, in a single write transaction, with:
##   - every read-only scalar's DEFVAL (tmpfs is empty on every boot)
##   - every read-write scalar's DEFVAL, but only when its
##     STORAGE_MODE_<name> resolves to STORAGE_MODE_VOLATILE
##     (a missing STORAGE_MODE_<name> is a hard #error, never a silent 0)
## Scalars without a DEFVAL clause in the MIB (e.g. sampleCount) get a
## documented zero/empty default instead.
######################################################################
@open cache_bootstrap.c@
/*
 * cache_bootstrap.c -- startup defaults for the volatile (cache.lmdb)
 * environment.
 *
 * GENERATED by mib2c using mib2c/mib2c.bootstrap.conf.
 * DO NOT EDIT BY HAND -- regenerate with scripts/gen_mib2c.sh.
 *
 * Source of truth for each default is the MIB's DEFVAL clause
 * (mibs/AGENTX-DEMO-MIB.txt); objects without one get a documented
 * zero/empty value (see per-object comments below). Everything is
 * written in a single write transaction, per include/cache_bootstrap.h.
 */
#include <string.h>

#include "cache_bootstrap.h"
#include "storage_lmdb.h"
#include "storage_mode.h"

storage_rc_t
cache_bootstrap_defaults(storage_env_t *cache, int overwrite)
{
    storage_txn_t *txn;
    storage_rc_t rc = storage_txn_begin(cache, 0 /* read-write */, &txn);

    if (rc != STORAGE_OK) {
        return rc;
    }

@foreach $i scalars@
@if $i.settable@
#ifndef STORAGE_MODE_$i
#error "STORAGE_MODE_$i is not defined in storage_mode.h -- add an entry for '$i' (see docs/design.md 3.1)"
#endif
#if STORAGE_MODE_$i == STORAGE_MODE_VOLATILE
    /* $i: read-write, but STORAGE_MODE_$i is VOLATILE -> lives in cache.lmdb */
    {
@end@
@if !$i.settable@
    /* $i: read-only, always cache.lmdb */
    {
@end@
@if $i.perltype eq "OCTETSTR"@
@if $i.hasdefval@
@eval $strval = "$i.defval"@
        static const char defval[] = $strval;
@else@
        /* no DEFVAL in the MIB: documented empty-string default */
        static const char defval[] = "";
@end@
        char probe[1];
        size_t probe_len = sizeof(probe);
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

        if (!overwrite) {
            exists_rc = storage_txn_get_bytes(txn, "$i", probe, &probe_len);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_bytes(txn, "$i", defval, strlen(defval));
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@elsif $i.perltype eq "INTEGER" || $i.perltype eq "INTEGER32"@
        int32_t defval;
        int32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $i.enums@
        defval = 0; /* overwritten below if the DEFVAL label is matched */
@foreach $lbl, $val enum@
@if "$lbl" eq "$i.defval"@
        defval = $val; /* DEFVAL { $lbl } */
@end@
@end@
@elsif $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        if (!overwrite) {
            exists_rc = storage_txn_get_int(txn, "$i", &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_int(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@else@
        uint32_t defval;
        uint32_t probe;
        storage_rc_t exists_rc = STORAGE_ERR_NOTFOUND;

@if $i.hasdefval@
        defval = $i.defval;
@else@
        defval = 0; /* no DEFVAL in the MIB: documented zero default */
@end@
        if (!overwrite) {
            exists_rc = storage_txn_get_uint(txn, "$i", &probe);
        }
        if (overwrite || exists_rc == STORAGE_ERR_NOTFOUND) {
            rc = storage_txn_set_uint(txn, "$i", defval);
            if (rc != STORAGE_OK) {
                storage_txn_abort(txn);
                return rc;
            }
        }
@end@
    }
@if $i.settable@
#endif /* STORAGE_MODE_$i == STORAGE_MODE_VOLATILE */
@end@

@end@
    return storage_txn_commit(txn);
}
