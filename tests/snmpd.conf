# snmpd.conf fixture for the agentx-subagent integration test suite
# (docs/design.md ch.5.3 / README architecture diagram).
#
# This file is a *template*: every script that uses it copies it into its own
# scratch directory and substitutes the placeholders below with `sed` before
# starting snmpd, so concurrently running scenarios never collide on ports
# or socket paths.
#
#   @@AGENTX_SOCK@@   unix:/path/to/agentx.sock  (AgentX master transport)
#   @@TRAP_PORT@@     udp:127.0.0.1:PORT         (trap2sink destination)
#
# Callers MUST start snmpd with `-C` (ignore the system default
# /etc/snmp/snmpd.conf and snmpd.conf.d) -- the stock Debian/Ubuntu default
# config sets `agentaddress 127.0.0.1,[::1]`, which fails to bind in any
# sandbox/container without IPv6, and it would also pull in unrelated
# rocommunity/view directives that shadow the ones below.

# --- AgentX master, over a unix domain socket -------------------------
master         agentx
agentXSocket   @@AGENTX_SOCK@@
agentXPerms    0700 0700
agentXTimeout  5
agentXRetries  3

# --- SNMPv1/v2c community, read-write, loopback only -------------------
rwcommunity    public 127.0.0.1

# --- SNMPv3 USM user -----------------------------------------------------
# Demonstrates that v3 auth/priv is handled entirely by snmpd (design.md
# 5.1 item 3): the subagent never sees USM, it only receives plain AgentX
# requests already stripped of any v3 envelope.
createUser     demoUser SHA "authpassword123" AES "privpassword123"
rwuser         demoUser priv

# --- notification/trap sink --------------------------------------------
trap2sink      @@TRAP_PORT@@ public
