# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repo has two dependency manifests worth tracking: the Rust app's
# Cargo.toml (rust-app/) and this workflow's own GitHub Actions versions.
# There is no npm/pip/go manifest here, so no other ecosystem is listed.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust-app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
